id: http-request
name: HTTP Request
version: 1.1.0
description: Send HTTP requests (GET/POST/PUT/PATCH/DELETE) with auth, headers, and file uploads
author: HedgeBuddy
category: http
icon: globe

inputs:
  - name: url
    type: url
    required: true
    label: URL
    description: Target URL to send the request to
  - name: body
    type: string
    required: false
    label: Request Body
    description: "JSON request body (supports template variables)"
    for_modes: [post, put, patch, delete]
  - name: auth
    type: string
    required: false
    label: Authorization
    description: "Authorization header value (e.g. Bearer your-token)"
  - name: headers
    type: string
    required: false
    label: Headers
    description: "HTTP headers as JSON object"
  - name: timeout
    type: string
    required: false
    label: Timeout
    description: "Request timeout (e.g. 30s, 2m)"
    default: "30s"
  - name: file_path
    type: path
    required: true
    label: File to Upload
    description: Local file path to upload
    for_modes: [upload]
  - name: file_field
    type: string
    required: false
    label: File Field Name
    description: "Form field name for the file (default: file)"
    default: "file"
    for_modes: [upload]
  - name: fields
    type: string
    required: false
    label: Form Fields
    description: "Additional form fields as JSON object"
    for_modes: [upload]

compatible_triggers: ["*"]

modes:
  get:
    label: GET
    description: Send an HTTP GET request
    steps:
      - action: http.get
        url: "{{inputs.url}}"
        auth: "{{inputs.auth}}"
        headers: "{{inputs.headers}}"
        timeout: "{{inputs.timeout}}"
        output: response
  post:
    label: POST
    description: Send an HTTP POST request with JSON body
    steps:
      - action: http.post
        url: "{{inputs.url}}"
        body: "{{inputs.body}}"
        auth: "{{inputs.auth}}"
        headers: "{{inputs.headers}}"
        timeout: "{{inputs.timeout}}"
        output: response
  put:
    label: PUT
    description: Send an HTTP PUT request with JSON body
    steps:
      - action: http.put
        url: "{{inputs.url}}"
        body: "{{inputs.body}}"
        auth: "{{inputs.auth}}"
        headers: "{{inputs.headers}}"
        timeout: "{{inputs.timeout}}"
        output: response
  patch:
    label: PATCH
    description: Send an HTTP PATCH request with JSON body
    steps:
      - action: http.patch
        url: "{{inputs.url}}"
        body: "{{inputs.body}}"
        auth: "{{inputs.auth}}"
        headers: "{{inputs.headers}}"
        timeout: "{{inputs.timeout}}"
        output: response
  delete:
    label: DELETE
    description: Send an HTTP DELETE request
    steps:
      - action: http.delete
        url: "{{inputs.url}}"
        body: "{{inputs.body}}"
        auth: "{{inputs.auth}}"
        headers: "{{inputs.headers}}"
        timeout: "{{inputs.timeout}}"
        output: response
  upload:
    label: Upload
    description: Upload a file via multipart/form-data POST
    steps:
      - action: http.upload
        url: "{{inputs.url}}"
        file_path: "{{inputs.file_path}}"
        file_field: "{{inputs.file_field}}"
        fields: "{{inputs.fields}}"
        auth: "{{inputs.auth}}"
        headers: "{{inputs.headers}}"
        timeout: "{{inputs.timeout}}"
        output: response
