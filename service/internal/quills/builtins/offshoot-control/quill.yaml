id: offshoot-control
name: OffShoot Control
version: 1.0.0
description: Control the OffShoot application
author: HedgeBuddy
category: offshoot
icon: hard-drive

inputs:
  - name: paths
    type: path
    required: true
    label: Source Path
    description: Source disk or folder path
    for_modes: [set-source]
  - name: label
    type: string
    required: false
    label: Source Label
    description: Label for the source
    for_modes: [set-source]
  - name: path
    type: path
    required: true
    label: Destination Path
    description: Destination folder path
    for_modes: [set-destination]
  - name: type
    type: enum
    required: false
    label: Reset Target
    description: Which dropzones to reset
    values: ["sources", "destinations"]
    for_modes: [reset]
  - name: json
    type: string
    required: true
    label: Actions JSON
    description: JSON array of OffShoot actions
    for_modes: [chain]

compatible_triggers:
  - OffShootStarted
  - DiskAdded
  - DiskRemoved
  - DiskBusy
  - DiskIdle
  - DisksIdle
  - TransfersAdded
  - FileCopyCompleted
  - VerificationIssue

modes:
  open:
    label: Open
    description: Open or focus OffShoot
    steps:
      - action: offshoot.open
  quit:
    label: Quit
    description: Quit OffShoot
    steps:
      - action: offshoot.quit
  set-source:
    label: Set Source
    description: Set source paths in OffShoot
    steps:
      - action: offshoot.setSource
        paths: "{{inputs.paths}}"
        label: "{{inputs.label}}"
  set-destination:
    label: Set Destination
    description: Set destination path in OffShoot
    steps:
      - action: offshoot.setDestination
        path: "{{inputs.path}}"
  add-transfers:
    label: Add Transfers
    description: Start queued transfers in OffShoot
    steps:
      - action: offshoot.addTransfers
  reset:
    label: Reset
    description: Remove disks from OffShoot dropzones
    steps:
      - action: offshoot.reset
        type: "{{inputs.type}}"
  reload-presets:
    label: Reload Presets
    description: Reload preset files in OffShoot
    steps:
      - action: offshoot.reloadPresets
  chain:
    label: Chain Actions
    description: Send chained actions to OffShoot
    steps:
      - action: offshoot.chain
        json: "{{inputs.json}}"
