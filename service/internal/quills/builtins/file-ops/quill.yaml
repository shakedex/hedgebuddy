id: file-ops
name: File Operations
version: 1.0.0
description: Move, copy, write, or append files
author: HedgeBuddy
category: file
icon: file

inputs:
  - name: source
    type: path
    required: true
    label: Source Path
    description: Source file or directory path
    for_modes: [move, copy]
  - name: destination
    type: path
    required: true
    label: Destination Path
    description: Destination file or directory path
    for_modes: [move, copy]
  - name: path
    type: path
    required: true
    label: File Path
    description: File path to write or append to
    for_modes: [write, append]
  - name: content
    type: string
    required: true
    label: Content
    description: Content to write or append
    for_modes: [write, append]

compatible_triggers: ["*"]

modes:
  move:
    label: Move
    description: Move a file or directory to a new location
    steps:
      - action: file.move
        source: "{{inputs.source}}"
        destination: "{{inputs.destination}}"
  copy:
    label: Copy
    description: Copy a file to a new location
    steps:
      - action: file.copy
        source: "{{inputs.source}}"
        destination: "{{inputs.destination}}"
  write:
    label: Write
    description: Write content to a file (overwrites existing)
    steps:
      - action: file.write
        path: "{{inputs.path}}"
        content: "{{inputs.content}}"
  append:
    label: Append
    description: Append content to a file
    steps:
      - action: file.append
        path: "{{inputs.path}}"
        content: "{{inputs.content}}"
