id: event-logger
name: Event Logger
version: 1.0.0
description: Write event details to a timestamped log file
author: HedgeBuddy
category: logging
icon: scroll-text

inputs:
  - name: LOG_PATH
    type: path
    required: true
    label: Log File Path
    description: Path to the log file
  - name: LOG_FORMAT
    type: string
    required: false
    label: Log Format
    description: "Custom log message template (supports {{event_name}}, {{app_id}}, {{event_summary}})"
    default: "[{{event_name}}] from {{app_id}}: {{event_summary}}"

compatible_triggers: ["*"]

steps:
  - action: template.render
    template: "{{inputs.LOG_FORMAT}}"
    output: rendered_message
  - action: log.write
    message: "{{steps.rendered_message}}"
    path: "{{inputs.LOG_PATH}}"
