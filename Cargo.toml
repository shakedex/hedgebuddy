[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.11.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/shakedex/hedgebuddy"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
hedgebuddy-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
directories = "6"
