id: email-notify
name: Email Notification
version: 1.1.0
description: Send an email notification via SMTP when a workflow event fires
author: HedgeBuddy
category: messaging
icon: mail

implementation: python
entry: main.py

settings:
  - name: smtp_host
    type: string
    required: true
    label: SMTP Host
    description: SMTP server hostname
    default: smtp.gmail.com
  - name: smtp_port
    type: string
    required: true
    label: SMTP Port
    description: SMTP server port
    default: "587"
  - name: username
    type: string
    required: true
    label: Username
    description: SMTP authentication username
  - name: password
    type: secure
    required: true
    label: Password
    description: SMTP authentication password (app password for Gmail)

inputs:
  - name: to
    type: string
    required: true
    label: To
    description: Recipient email address
  - name: subject
    type: string
    required: true
    label: Subject
    description: Email subject line
    default: "[HedgeBuddy] {{event_name}} from {{app_id}}"
  - name: body
    type: string
    required: true
    label: Body
    description: Email body text
    default: "Event: {{event_name}}\nApp: {{app_id}}\n\n{{event_summary}}"

compatible_triggers:
  - "*"
