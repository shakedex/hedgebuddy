id: arri-art-cmd
name: ARRI ART-CMD
version: 1.1.0
description: Process ARRI camera footage using ART-CMD (verify, export, copy, process, mxf-recovery)
author: HedgeBuddy
category: media-processing
icon: film

settings:
  - name: art_cmd_path
    type: path
    required: true
    label: ART-CMD Path
    description: Path to the art-cmd executable (configured once)

inputs:
  # ── Common inputs (all modes) ─────────────────────────────────
  - name: input
    type: path
    required: true
    label: Input
    description: Input file, directory, or clip path
  - name: output
    type: path
    required: true
    label: Output
    description: Output file or directory path
  - name: start
    type: number
    required: false
    label: Start Frame
    description: Start frame number to read from input (default 0)
  - name: duration
    type: number
    required: false
    label: Duration
    description: Duration in frames to read from input (default all)
  - name: metadata_overrides
    type: path
    required: false
    label: Metadata Overrides
    description: Path to a JSON overrides file for correcting static clip metadata
  - name: verbose
    type: boolean
    required: false
    label: Verbose
    description: Enable verbose logging output
    default: "false"
  - name: logpath
    type: path
    required: false
    label: Log Path
    description: Path for log file output

  # ── Verify mode inputs ────────────────────────────────────────
  - name: skip_video
    type: boolean
    required: false
    label: Skip Video
    description: Skip video frame checksum verification
    default: "false"
    for_modes: [verify]
  - name: skip_audio
    type: boolean
    required: false
    label: Skip Audio
    description: Skip audio verification or export
    default: "false"
    for_modes: [verify, export]
  - name: skip_metadata
    type: boolean
    required: false
    label: Skip Metadata
    description: Skip metadata verification or export
    default: "false"
    for_modes: [verify, export]

  # ── Export mode inputs ────────────────────────────────────────
  - name: skip_look
    type: boolean
    required: false
    label: Skip Look
    description: Skip export of look files
    default: "false"
    for_modes: [export]
  - name: no_squash_json
    type: boolean
    required: false
    label: No Squash JSON
    description: Keep full base64 data in JSON exports (can produce very large files)
    default: "false"
    for_modes: [export]

  # ── Process mode inputs ───────────────────────────────────────
  - name: video_codec
    type: enum
    required: false
    label: Video Codec
    description: Output video codec
    values:
      - exr_uncompressed/f16
      - exr_piz/f16
      - exr_zip/f16
      - exr_zips/f16
      - exr_b44a_lossy/f16
      - exr_uncompressed/f32
      - exr_piz/f32
      - exr_zip/f32
      - exr_zips/f32
      - exr_b44a_lossy/f32
      - prores422lt
      - prores422
      - prores422hq
      - prores4444
      - prores4444xq
    for_modes: [process]
  - name: target_colorspace
    type: enum
    required: false
    label: Target Colorspace
    description: Target colorspace for output
    values:
      - AP0/D60/linear
      - AWG4/D65/linear
      - AWG4/D65/LogC4
      - AWG3/D65/linear
      - AWG3/D65/LogC3
      - P3/D60/DCI
      - P3/D65/DCI
      - P3/D65/PQ
      - P3/DCI/DCI
      - Rec.2020/D65/BT.1886
      - Rec.2020/D65/HLG
      - Rec.2020/D65/PQ
      - Rec.709/D65/BT.1886
    for_modes: [process]
  - name: arri_look_file
    type: path
    required: false
    label: ARRI Look File
    description: External ARRI Look File (.aml, .alf4, or .alf4c)
    for_modes: [process]
  - name: embedded_look
    type: boolean
    required: false
    label: Embedded Look
    description: Apply the look embedded in the input clip
    default: "false"
    for_modes: [process]
  - name: parameters
    type: path
    required: false
    label: Parameters File
    description: JSON or XML file with ARRIRAW/ARRICORE decoding parameters
    for_modes: [process]
  - name: deflip
    type: boolean
    required: false
    label: Deflip
    description: Apply flip/flop according to camera metadata
    default: "false"
    for_modes: [process]
  - name: desqueeze
    type: boolean
    required: false
    label: Desqueeze
    description: Apply lens desqueeze according to lens metadata
    default: "false"
    for_modes: [process]
  - name: output_width
    type: number
    required: false
    label: Output Width
    description: Target output width in pixels (height computed to preserve aspect ratio)
    for_modes: [process]
  - name: output_height
    type: number
    required: false
    label: Output Height
    description: Target output height in pixels (width computed to preserve aspect ratio)
    for_modes: [process]
  - name: letterbox_size
    type: string
    required: false
    label: Letterbox Size
    description: "Letterbox dimensions as WIDTHxHEIGHT (e.g. 1920x1080)"
    for_modes: [process]

compatible_triggers:
  - "*"

# ── Modes ──────────────────────────────────────────────────────

modes:
  verify:
    label: Verify
    description: Verify video frame checksums or compare two clips
    steps:
      - action: shell.exec
        command: "{{settings.art_cmd_path}}"
        args:
          - verify
        flags:
          --verbose: "{{inputs.verbose}}"
          --skip-video: "{{inputs.skip_video}}"
          --skip-audio: "{{inputs.skip_audio}}"
          --skip-metadata: "{{inputs.skip_metadata}}"
        options:
          --input: "{{inputs.input}}"
          --output: "{{inputs.output}}"
          --start: "{{inputs.start}}"
          --duration: "{{inputs.duration}}"
          --metadata-overrides: "{{inputs.metadata_overrides}}"
          --logpath: "{{inputs.logpath}}"
        timeout: 30m

  export:
    label: Export
    description: Export audio, metadata, and look files from clips
    steps:
      - action: shell.exec
        command: "{{settings.art_cmd_path}}"
        args:
          - export
        flags:
          --verbose: "{{inputs.verbose}}"
          --skip-audio: "{{inputs.skip_audio}}"
          --skip-metadata: "{{inputs.skip_metadata}}"
          --skip-look: "{{inputs.skip_look}}"
          --no-squash-json: "{{inputs.no_squash_json}}"
        options:
          --input: "{{inputs.input}}"
          --output: "{{inputs.output}}"
          --start: "{{inputs.start}}"
          --duration: "{{inputs.duration}}"
          --metadata-overrides: "{{inputs.metadata_overrides}}"
          --logpath: "{{inputs.logpath}}"
        timeout: 10m

  copy:
    label: Copy
    description: Copy ARRIRAW, ARRICORE, or ProRes clips (optionally trimmed) to MXF
    steps:
      - action: shell.exec
        command: "{{settings.art_cmd_path}}"
        args:
          - copy
        flags:
          --verbose: "{{inputs.verbose}}"
        options:
          --input: "{{inputs.input}}"
          --output: "{{inputs.output}}"
          --start: "{{inputs.start}}"
          --duration: "{{inputs.duration}}"
          --metadata-overrides: "{{inputs.metadata_overrides}}"
          --logpath: "{{inputs.logpath}}"
        timeout: 1h

  process:
    label: Process
    description: Decode and render ARRIRAW/ARRICORE/ProRes clips with color processing
    steps:
      - action: shell.exec
        command: "{{settings.art_cmd_path}}"
        args:
          - process
        flags:
          --verbose: "{{inputs.verbose}}"
          --embedded-look: "{{inputs.embedded_look}}"
          --deflip: "{{inputs.deflip}}"
          --desqueeze: "{{inputs.desqueeze}}"
        options:
          --input: "{{inputs.input}}"
          --output: "{{inputs.output}}"
          --start: "{{inputs.start}}"
          --duration: "{{inputs.duration}}"
          --metadata-overrides: "{{inputs.metadata_overrides}}"
          --logpath: "{{inputs.logpath}}"
          --video-codec: "{{inputs.video_codec}}"
          --target-colorspace: "{{inputs.target_colorspace}}"
          --arri-look-file: "{{inputs.arri_look_file}}"
          --parameters: "{{inputs.parameters}}"
          --output-width: "{{inputs.output_width}}"
          --output-height: "{{inputs.output_height}}"
          --letterbox-size: "{{inputs.letterbox_size}}"
        timeout: 2h

  mxf-recovery:
    label: MXF Recovery
    description: Recover and rewrite damaged MXF files
    steps:
      - action: shell.exec
        command: "{{settings.art_cmd_path}}"
        args:
          - mxf-recovery
        flags:
          --verbose: "{{inputs.verbose}}"
        options:
          --input: "{{inputs.input}}"
          --output: "{{inputs.output}}"
          --metadata-overrides: "{{inputs.metadata_overrides}}"
          --logpath: "{{inputs.logpath}}"
        timeout: 1h
