id: slack-notify
name: Slack Notification
version: 1.1.0
description: Send a Slack message via incoming webhook when a workflow event occurs
author: HedgeBuddy
category: messaging
icon: bell

settings:
  - name: webhook_url
    type: url
    required: true
    label: Webhook URL
    description: Slack incoming webhook URL

test_connection:
  action: http.post
  config:
    url: "{{settings.webhook_url}}"
    body:
      text: "HedgeBuddy connection test — Slack webhook is working!"
  expect_status: 200

inputs:
  - name: message
    type: string
    required: true
    label: Message
    description: The message text to send (supports {{event.*}} templates)
    default: "{{event_name}} from {{app_id}}: {{event_summary}}"
  - name: channel
    type: string
    required: false
    label: Channel Override
    description: Override the webhook's default channel (optional)

compatible_triggers:
  - "*"

steps:
  - action: template.render
    template: "{{inputs.message}}"
    output: rendered_message
  - action: http.post
    url: "{{settings.webhook_url}}"
    body:
      text: "{{steps.rendered_message}}"
      channel: "{{inputs.channel}}"
    output: slack_response
