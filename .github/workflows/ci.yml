name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/sync_version.py --check

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - name: Build frontend (the app crate embeds ui/dist at compile time)
        working-directory: crates/app/ui
        run: |
          bun install --frozen-lockfile
          bun run gen:check
          bun run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run pytest -v
      - run: uv build
      - run: uv run python scripts/check_dist.py

  bundle:
    name: App bundle (${{ matrix.os }})
    # Builds the unsigned installer layout (spec section 8) and checks that the
    # hedgebuddy command and the wheel land where the app looks for them.
    # Nothing is signed or uploaded.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2
      - name: Build frontend
        working-directory: crates/app/ui
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Place the bundled command and wheel
        run: python scripts/prepare_bundle.py
      - name: Build the bundle (unsigned)
        working-directory: crates/app
        run: bunx @tauri-apps/cli@2 build --config tauri.bundle.conf.json --bundles ${{ matrix.os == 'windows-latest' && 'nsis' || 'app' }}
      - name: Check the bundle layout
        run: python scripts/check_bundle.py target
