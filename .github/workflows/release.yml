name: Release HedgeBuddy

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 1.0.0)"
        required: true
        default: "1.0.0"
      create_tag:
        description: "Create git tag for this version?"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  create-tag:
    name: Create Version Tag
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_tag == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create and push tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "v${{ github.event.inputs.version }}" -m "Release v${{ github.event.inputs.version }}"
          git push origin "v${{ github.event.inputs.version }}"

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: [create-tag]
    if: always() && (needs.create-tag.result == 'success' || needs.create-tag.result == 'skipped')
    defaults:
      run:
        working-directory: ./app
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify version sync
        working-directory: ${{ github.workspace }}
        run: python scripts/sync_version.py --check

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: app/go.mod

      - name: Install Fyne CLI
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Package Windows executable
        run: fyne package -os windows -icon icon.png -name HedgeBuddy

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: HedgeBuddy-Windows
          path: app/HedgeBuddy.exe

  build-macos:
    name: Build macOS (ARM64)
    runs-on: macos-14
    needs: [create-tag]
    if: always() && (needs.create-tag.result == 'success' || needs.create-tag.result == 'skipped')
    defaults:
      run:
        working-directory: ./app
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify version sync
        working-directory: ${{ github.workspace }}
        run: python3 scripts/sync_version.py --check

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: app/go.mod

      - name: Install Fyne CLI
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Package macOS app bundle
        run: fyne package -os darwin -icon icon.png -name HedgeBuddy

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          mkdir -p dmg_temp
          cp -r HedgeBuddy.app dmg_temp/HedgeBuddy.app

          create-dmg \
            --volname "HedgeBuddy" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "HedgeBuddy.app" 200 190 \
            --hide-extension "HedgeBuddy.app" \
            --app-drop-link 600 185 \
            --no-internet-enable \
            "HedgeBuddy-macOS-arm64.dmg" \
            "dmg_temp/"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: HedgeBuddy-macOS-ARM64
          path: app/HedgeBuddy-macOS-arm64.dmg

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    if: always() && needs.build-windows.result == 'success' && needs.build-macos.result == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: HedgeBuddy-Windows
          path: ./artifacts/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: HedgeBuddy-macOS-ARM64
          path: ./artifacts/macos

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "tag=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: HedgeBuddy v${{ steps.get_version.outputs.version }}
          body: |
            ## HedgeBuddy v${{ steps.get_version.outputs.version }}

            ### Downloads
            - **Windows (x64)**: `HedgeBuddy.exe`
            - **macOS (Apple Silicon)**: `HedgeBuddy-macOS-arm64.dmg`

            ### Installation

            **Windows**
            1. Download `HedgeBuddy.exe`
            2. Run the executable (no installation needed)
            3. Variables stored at: `%APPDATA%\HedgeBuddy\<profile>\vars.json`

            **macOS**
            1. Download and open `HedgeBuddy-macOS-arm64.dmg`
            2. Drag `HedgeBuddy.app` to Applications
            3. **Important (unsigned app):** Open Terminal and run:
               ```
               xattr -cr /Applications/HedgeBuddy.app
               ```
            4. Open HedgeBuddy from Applications
            5. Variables stored at: `~/Library/Application Support/HedgeBuddy/<profile>/vars.json`

            ### Python Library
            Install companion library: `pip install hedgebuddy`
            Use in scripts: `import hedgebuddy`
          files: |
            ./artifacts/windows/HedgeBuddy.exe
            ./artifacts/macos/HedgeBuddy-macOS-arm64.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
