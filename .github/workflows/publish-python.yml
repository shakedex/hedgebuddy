name: Publish Python package

# Manual only. Before the first run, add a trusted publisher on pypi.org for
# project "hedgebuddy": owner shakedex, repository hedgebuddy, workflow
# publish-python.yml, environment pypi. See docs/releasing-python.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/sync_version.py --check
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - working-directory: python
        run: |
          uv sync --frozen
          uv run pytest -q
          uv build
          uv run python scripts/check_dist.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
