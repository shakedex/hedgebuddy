name: Publish Python Package to PyPI

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            version:
                description: "Version to publish (e.g., 0.1.0)"
                required: true
                type: string

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    publish:
        name: Build and Publish to PyPI
        runs-on: ubuntu-latest
        environment: pypi
        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.13"

            - name: Install uv
              run: |
                  curl -LsSf https://astral.sh/uv/install.sh | sh
                  echo "$HOME/.cargo/bin" >> $GITHUB_PATH

            - name: Verify version sync (release trigger)
              if: github.event_name == 'release'
              run: python scripts/sync_version.py --check

            - name: Update version (manual trigger)
              if: github.event_name == 'workflow_dispatch'
              run: python scripts/sync_version.py --set ${{ github.event.inputs.version }}

            - name: Install dependencies
              working-directory: ./python-lib
              run: |
                  uv pip install --system build twine

            - name: Run tests
              working-directory: ./python-lib
              run: |
                  uv pip install --system pytest pytest-cov
                  uv run pytest tests/ -v

            - name: Build package
              working-directory: ./python-lib
              run: |
                  python -m build

            - name: Check package
              working-directory: ./python-lib
              run: |
                  twine check dist/*

            - name: Publish to PyPI
              working-directory: ./python-lib
              env:
                  TWINE_USERNAME: __token__
                  TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
              run: |
                  twine upload dist/*

            - name: Create summary
              if: github.event_name == 'release'
              run: |
                  echo "## 🎉 Published to PyPI!" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "**Package**: hedgebuddy" >> $GITHUB_STEP_SUMMARY
                  echo "**Version**: ${{ github.event.release.tag_name }}" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "### Installation" >> $GITHUB_STEP_SUMMARY
                  echo '```bash' >> $GITHUB_STEP_SUMMARY
                  echo "pip install --user hedgebuddy" >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "**PyPI**: https://pypi.org/project/hedgebuddy/" >> $GITHUB_STEP_SUMMARY
