name: Release Quills Service

on:
  push:
    tags:
      - "quills-v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 0.9.0)"
        required: true
        default: "0.9.0"
      create_tag:
        description: "Create git tag for this version?"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GO_VERSION: "1.25"

jobs:
  # ------------------------------------------------------------------
  # Optional: create a tag from workflow_dispatch
  # ------------------------------------------------------------------
  create-tag:
    name: Create Version Tag
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_tag == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create and push tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "quills-v${{ github.event.inputs.version }}" \
            -m "Quills v${{ github.event.inputs.version }}"
          git push origin "quills-v${{ github.event.inputs.version }}"

  # ------------------------------------------------------------------
  # Build the web UI (shared by both platform builds)
  # ------------------------------------------------------------------
  build-web:
    name: Build Web UI
    runs-on: ubuntu-latest
    needs: [create-tag]
    if: always() && (needs.create-tag.result == 'success' || needs.create-tag.result == 'skipped')
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Verify version sync
        run: python3 scripts/sync_quills_version.py --check

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: service/web
        run: bun install --frozen-lockfile

      - name: Build web UI
        working-directory: service/web
        run: bun run build

      - name: Upload web dist
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: service/web/dist/

  # ------------------------------------------------------------------
  # Build Windows binary
  # ------------------------------------------------------------------
  build-windows:
    name: Build Windows Binary
    runs-on: windows-latest
    needs: [build-web]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download web dist
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: service/web/dist

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF#refs/tags/quills-v}"
            echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Quills binary
        working-directory: service
        env:
          CGO_ENABLED: "1"
        run: |
          go build -ldflags "-H windowsgui" -o bin\quills.exe .

      - name: Upload Windows binary
        uses: actions/upload-artifact@v7
        with:
          name: Quills-Windows
          path: service/bin/quills.exe

  # ------------------------------------------------------------------
  # Build macOS universal binary
  # ------------------------------------------------------------------
  build-macos:
    name: Build macOS Binary
    runs-on: macos-14
    needs: [build-web]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download web dist
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: service/web/dist

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF#refs/tags/quills-v}"
            echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build arm64 binary
        working-directory: service
        env:
          CGO_ENABLED: "1"
          GOARCH: arm64
        run: go build -o bin/quills-arm64 .

      - name: Build amd64 binary
        working-directory: service
        env:
          CGO_ENABLED: "1"
          GOARCH: amd64
        run: go build -o bin/quills-amd64 .

      - name: Create universal binary
        working-directory: service
        run: lipo -create -output bin/quills bin/quills-arm64 bin/quills-amd64

      - name: Upload macOS binary
        uses: actions/upload-artifact@v7
        with:
          name: Quills-macOS
          path: service/bin/quills

  # ------------------------------------------------------------------
  # Create GitHub Release
  # ------------------------------------------------------------------
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    if: always() && needs.build-windows.result == 'success' && needs.build-macos.result == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Windows binary
        uses: actions/download-artifact@v8
        with:
          name: Quills-Windows
          path: ./artifacts/windows

      - name: Download macOS binary
        uses: actions/download-artifact@v8
        with:
          name: Quills-macOS
          path: ./artifacts/macos

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=quills-v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/quills-v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Quills v${{ steps.version.outputs.version }}
          body: |
            ## Quills v${{ steps.version.outputs.version }}

            Quills is the Hedge automation engine — it runs in the background and processes events from Hedge ecosystem apps.

            > **Looking for an easy install?** Use the [HedgeBuddy Suite installer](../../releases) which bundles HedgeBuddy and Quills together.

            ### Standalone Binaries
            - **Windows**: `quills.exe`
            - **macOS (Universal)**: `quills` (Apple Silicon + Intel)

            These are raw binaries for advanced users or automated deployments.
          files: |
            ./artifacts/windows/quills.exe
            ./artifacts/macos/quills
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
