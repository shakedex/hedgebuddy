name: Release HedgeBuddy Suite

# Downloads already-released binaries from GitHub Releases and packages
# them into a single installer for each platform. No rebuilding.
#
# Prerequisites before running:
#   - HedgeBuddy v{hedgebuddy_version} must be released (tag: v{hedgebuddy_version})
#   - Quills v{quills_version} must be released (tag: quills-v{quills_version})

on:
  workflow_dispatch:
    inputs:
      hedgebuddy_version:
        description: "HedgeBuddy version (e.g., 0.9.0) — must be released"
        required: true
      quills_version:
        description: "Quills version (e.g., 0.9.0) — must be released"
        required: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VERSION_HB: ${{ github.event.inputs.hedgebuddy_version }}
  VERSION_QUILLS: ${{ github.event.inputs.quills_version }}

jobs:

  # ------------------------------------------------------------------
  # Build updater agent (pure Go — cross-compile from Linux, no CGO)
  # ------------------------------------------------------------------
  build-updater:
    name: Build Updater Agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Build Windows updater
        working-directory: updater
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -ldflags "-s -w" -o ../artifacts/updater.exe .

      - name: Build macOS arm64 updater
        working-directory: updater
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build -ldflags "-s -w" -o ../artifacts/updater-arm64 .

      - name: Build macOS amd64 updater
        working-directory: updater
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -ldflags "-s -w" -o ../artifacts/updater-amd64 .

      - name: Create universal macOS updater
        run: |
          brew install --quiet llvm || true
          lipo -create -output artifacts/updater-macos artifacts/updater-arm64 artifacts/updater-amd64

      - name: Upload Windows updater
        uses: actions/upload-artifact@v7
        with:
          name: Updater-Windows
          path: artifacts/updater.exe

      - name: Upload macOS updater
        uses: actions/upload-artifact@v7
        with:
          name: Updater-macOS
          path: artifacts/updater-macos

  # ------------------------------------------------------------------
  # Build Windows installer
  # ------------------------------------------------------------------
  build-windows-installer:
    name: Build Windows Installer
    runs-on: windows-latest
    needs: [build-updater]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download HedgeBuddy.exe from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p artifacts
          gh release download "v${{ env.VERSION_HB }}" \
            --repo ${{ github.repository }} \
            --pattern "HedgeBuddy.exe" \
            --dir artifacts/

      - name: Download quills.exe from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release download "quills-v${{ env.VERSION_QUILLS }}" \
            --repo ${{ github.repository }} \
            --pattern "quills.exe" \
            --dir artifacts/

      - name: Download updater.exe artifact
        uses: actions/download-artifact@v8
        with:
          name: Updater-Windows
          path: artifacts/

      - name: Install NSIS
        shell: powershell
        run: choco install nsis -y

      - name: Build suite installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\NSIS\makensis.exe" ^
            /DVERSION_HB=${{ env.VERSION_HB }} ^
            /DVERSION_QUILLS=${{ env.VERSION_QUILLS }} ^
            /DHB_EXE=%CD%\artifacts\HedgeBuddy.exe ^
            /DQUILLS_EXE=%CD%\artifacts\quills.exe ^
            /DUPDATER_EXE=%CD%\artifacts\updater.exe ^
            scripts\installer\windows\suite.nsi

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: Suite-Windows-Installer
          path: scripts/installer/windows/HedgeBuddy-Suite-v${{ env.VERSION_HB }}-quills-v${{ env.VERSION_QUILLS }}-Setup.exe

  # ------------------------------------------------------------------
  # Build macOS installer
  # ------------------------------------------------------------------
  build-macos-installer:
    name: Build macOS Installer
    runs-on: macos-14
    needs: [build-updater]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download HedgeBuddy DMG from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          gh release download "v${{ env.VERSION_HB }}" \
            --repo ${{ github.repository }} \
            --pattern "HedgeBuddy-macOS-arm64.dmg" \
            --dir artifacts/

      - name: Extract HedgeBuddy.app from DMG
        run: |
          hdiutil attach artifacts/HedgeBuddy-macOS-arm64.dmg -mountpoint /Volumes/HedgeBuddy -nobrowse -quiet
          cp -r /Volumes/HedgeBuddy/HedgeBuddy.app artifacts/HedgeBuddy.app
          hdiutil detach /Volumes/HedgeBuddy -quiet

      - name: Download Quills universal binary from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "quills-v${{ env.VERSION_QUILLS }}" \
            --repo ${{ github.repository }} \
            --pattern "quills" \
            --dir artifacts/
          chmod +x artifacts/quills

      - name: Download macOS updater artifact
        uses: actions/download-artifact@v8
        with:
          name: Updater-macOS
          path: artifacts/

      - name: Mark updater executable
        run: chmod +x artifacts/updater-macos

      - name: Build suite .pkg
        working-directory: scripts/installer/macos
        run: |
          chmod +x build-bundle-pkg.sh postinstall-bundle
          ./build-bundle-pkg.sh \
            "${{ env.VERSION_HB }}" \
            "${{ env.VERSION_QUILLS }}" \
            "../../../artifacts/HedgeBuddy.app" \
            "../../../artifacts/quills" \
            "../../../artifacts/updater-macos"
          mv HedgeBuddy-Suite-v${{ env.VERSION_HB }}-quills-v${{ env.VERSION_QUILLS }}.pkg \
            ../../../artifacts/

      - name: Upload macOS installer
        uses: actions/upload-artifact@v7
        with:
          name: Suite-macOS-Installer
          path: artifacts/HedgeBuddy-Suite-v${{ env.VERSION_HB }}-quills-v${{ env.VERSION_QUILLS }}.pkg

  # ------------------------------------------------------------------
  # Create GitHub Release
  # ------------------------------------------------------------------
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows-installer, build-macos-installer]
    if: always() && needs.build-windows-installer.result == 'success' && needs.build-macos-installer.result == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Windows installer
        uses: actions/download-artifact@v8
        with:
          name: Suite-Windows-Installer
          path: ./artifacts/windows

      - name: Download macOS installer
        uses: actions/download-artifact@v8
        with:
          name: Suite-macOS-Installer
          path: ./artifacts/macos

      - name: Create tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "suite-v${{ env.VERSION_HB }}" \
            -m "HedgeBuddy Suite (HedgeBuddy v${{ env.VERSION_HB }} + Quills v${{ env.VERSION_QUILLS }})" \
            || echo "Tag already exists, skipping"
          git push origin "suite-v${{ env.VERSION_HB }}" || echo "Tag already pushed, continuing"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: suite-v${{ env.VERSION_HB }}
          name: "HedgeBuddy Suite (HedgeBuddy v${{ env.VERSION_HB }} + Quills v${{ env.VERSION_QUILLS }})"
          body: |
            ## HedgeBuddy Suite

            One installer for everything — installs **HedgeBuddy v${{ env.VERSION_HB }}** and the **Quills v${{ env.VERSION_QUILLS }}** automation engine together.

            ### Downloads
            - **Windows**: `HedgeBuddy-Suite-v${{ env.VERSION_HB }}-quills-v${{ env.VERSION_QUILLS }}-Setup.exe`
            - **macOS**: `HedgeBuddy-Suite-v${{ env.VERSION_HB }}-quills-v${{ env.VERSION_QUILLS }}.pkg`

            ### Installation

            **Windows**
            1. Download and run the `.exe` installer
            2. Choose your install directory (defaults to `%LOCALAPPDATA%\HedgeBuddy`)
            3. Opt in to start Quills at login (recommended)
            4. HedgeBuddy and Quills are ready — find them in the Start Menu under **HedgeBuddy**

            **macOS**
            1. Download the `.pkg` and right-click → Open (required for unsigned packages)
            2. Follow the installer — HedgeBuddy lands in `~/Applications`, Quills in `/usr/local/bin`
            3. Quills auto-start is set up via a LaunchAgent in `~/Library/LaunchAgents`
            4. Toggle auto-start any time from the Quills menu bar icon → **Start at Login**

            ### Individual releases
            - [HedgeBuddy v${{ env.VERSION_HB }}](../../releases/tag/v${{ env.VERSION_HB }})
            - [Quills v${{ env.VERSION_QUILLS }}](../../releases/tag/quills-v${{ env.VERSION_QUILLS }})
          files: |
            ./artifacts/windows/HedgeBuddy-Suite-v${{ env.VERSION_HB }}-quills-v${{ env.VERSION_QUILLS }}-Setup.exe
            ./artifacts/macos/HedgeBuddy-Suite-v${{ env.VERSION_HB }}-quills-v${{ env.VERSION_QUILLS }}.pkg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
