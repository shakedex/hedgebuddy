version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      fyne:
        patterns:
          - "fyne.io/*"
          - "github.com/fyne-io/*"
      golang-x:
        patterns:
          - "golang.org/x/*"
      go-other:
        patterns:
          - "*"
        exclude-patterns:
          - "fyne.io/*"
          - "github.com/fyne-io/*"
          - "golang.org/x/*"

  - package-ecosystem: "pip"
    directory: "/python-lib"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"